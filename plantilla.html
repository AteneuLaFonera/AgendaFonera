<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda · La Fonera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --fucsia:#E4127E;
  --fucsia-deep:#A00E5A;
  --tint:#FDEFF6;
  --tint-2:#FBE2EE;
  --ink:#1B1220;
  --ink-2:#6E5D68;
  --ink-3:#9C8C96;
  --paper:#FAF6F7;
  --surface:#FFFFFF;
  --line:#EADFE5;
  --line-strong:#DCC9D4;
  --r-sm:6px;
  --r-md:10px;
  --r-lg:18px;
}

*{box-sizing:border-box;}

html,body{margin:0;padding:0;}

body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding:0 20px 80px;
}

.wrap{max-width:1060px;margin:0 auto;}

/* ---------- Masthead ---------- */
.masthead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:24px;
  padding:38px 0 22px;
  border-bottom:1px solid var(--line);
}
.masthead img{height:72px;width:auto;display:block;}
.masthead .kicker{
  font-size:11px;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--ink-3);
  font-weight:600;
  white-space:nowrap;
}

/* ---------- Month bar ---------- */
.monthbar{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  padding:30px 0 22px;
  flex-wrap:wrap;
}
.month-id{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;}
.month-name{
  font-family:'Bricolage Grotesque',sans-serif;
  font-weight:800;
  font-size:clamp(38px,7vw,64px);
  line-height:.92;
  letter-spacing:-.02em;
  text-transform:uppercase;
  margin:0;
}
.month-year{
  font-family:'Bricolage Grotesque',sans-serif;
  font-weight:500;
  font-size:clamp(20px,3vw,30px);
  color:var(--fucsia);
  letter-spacing:-.01em;
}
.month-tools{display:flex;align-items:center;gap:10px;padding-bottom:6px;}
.count{
  font-size:12px;
  color:var(--ink-2);
  margin-right:6px;
  white-space:nowrap;
}
.count b{color:var(--ink);font-weight:600;}
.nav{
  width:38px;height:38px;
  border:1px solid var(--line-strong);
  background:var(--surface);
  border-radius:50%;
  cursor:pointer;
  color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  transition:background .15s,border-color .15s,color .15s;
}
.nav svg{width:15px;height:15px;}
.nav:hover{background:var(--ink);border-color:var(--ink);color:#fff;}
.nav:focus-visible{outline:2px solid var(--fucsia);outline-offset:2px;}
.today-btn{
  border:1px solid var(--line-strong);
  background:var(--surface);
  border-radius:999px;
  padding:9px 16px;
  font-family:inherit;
  font-size:12px;
  font-weight:600;
  letter-spacing:.04em;
  text-transform:uppercase;
  cursor:pointer;
  color:var(--ink);
  transition:background .15s,border-color .15s,color .15s;
}
.today-btn:hover{background:var(--ink);border-color:var(--ink);color:#fff;}
.today-btn:focus-visible{outline:2px solid var(--fucsia);outline-offset:2px;}

/* ---------- Grid ---------- */
.board{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  overflow:hidden;
}
.weekdays{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  background:var(--surface);
  border-bottom:1px solid var(--line);
}
.weekdays span{
  padding:13px 12px;
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--ink-3);
}
.weekdays span:nth-child(n+6){color:var(--fucsia-deep);}

.grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
}
.cell{
  min-height:132px;
  padding:10px 10px 12px;
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
  display:flex;
  flex-direction:column;
  gap:6px;
  position:relative;
}
.cell:nth-child(7n){border-right:none;}
.grid .cell:nth-last-child(-n+7){border-bottom:none;}
.cell.pad{background:#FCFAFB;}
.cell.closed{
  background:repeating-linear-gradient(-45deg,transparent,transparent 7px,#F7F1F4 7px,#F7F1F4 8px);
}

.daynum{
  font-family:'Bricolage Grotesque',sans-serif;
  font-size:14px;
  font-weight:700;
  color:var(--ink-2);
  line-height:1;
  min-height:22px;
  display:flex;
  align-items:center;
}
.cell.pad .daynum{color:#CBBCC5;}
.cell.today .daynum{
  position:relative;
  color:#fff;
  justify-content:center;
  width:26px;height:26px;
  margin:-3px 0 0 -3px;
}
.cell.today .daynum .star{
  position:absolute;inset:0;width:26px;height:26px;z-index:0;
}
.cell.today .daynum span{position:relative;z-index:1;font-size:12px;}

.closed-tag{
  margin-top:auto;
  font-size:9.5px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--ink-3);
  font-weight:600;
}

.ev{
  display:block;
  width:100%;
  text-align:left;
  font-family:inherit;
  background:var(--tint);
  border:none;
  border-left:3px solid var(--fucsia);
  border-radius:0 var(--r-sm) var(--r-sm) 0;
  padding:6px 8px 7px;
  cursor:pointer;
  transition:background .14s,transform .14s;
}
.ev:hover{background:var(--tint-2);transform:translateX(2px);}
.ev:focus-visible{outline:2px solid var(--fucsia);outline-offset:1px;}
.ev-time{
  display:block;
  font-size:10px;
  font-weight:700;
  letter-spacing:.06em;
  color:var(--fucsia-deep);
  margin-bottom:1px;
}
.ev-title{
  display:block;
  font-size:12px;
  font-weight:600;
  line-height:1.28;
  color:var(--ink);
}

/* ---------- Agenda list (mobile) ---------- */
.agenda{display:none;}
.ag-item{
  display:flex;
  gap:16px;
  padding:16px 0;
  border-bottom:1px solid var(--line);
  width:100%;
  background:none;
  border-left:none;border-right:none;border-top:none;
  text-align:left;
  font-family:inherit;
  cursor:pointer;
}
.ag-item:last-child{border-bottom:none;}
.ag-date{
  flex-shrink:0;
  width:46px;
  text-align:center;
}
.ag-dow{
  font-size:10px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);
}
.ag-dnum{
  font-family:'Bricolage Grotesque',sans-serif;
  font-size:24px;font-weight:800;line-height:1.05;color:var(--ink);
}
.ag-body{flex:1;min-width:0;}
.ag-time{font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--fucsia-deep);}
.ag-title{font-size:15px;font-weight:600;line-height:1.3;margin-top:2px;}

/* ---------- Empty ---------- */
.empty{
  padding:70px 24px;
  text-align:center;
}
.empty img{width:44px;height:44px;opacity:.28;margin-bottom:14px;}
.empty h3{
  font-family:'Bricolage Grotesque',sans-serif;
  font-size:18px;font-weight:700;margin:0 0 6px;
}
.empty p{margin:0;color:var(--ink-2);font-size:14px;}

/* ---------- Footer ---------- */
.foot{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:18px 2px 0;
  font-size:12px;
  color:var(--ink-3);
  flex-wrap:wrap;
}
.legend{display:flex;align-items:center;gap:16px;}
.legend span{display:flex;align-items:center;gap:7px;}
.sw{width:13px;height:13px;border-radius:3px;display:block;}
.sw.ev{background:var(--tint);border-left:3px solid var(--fucsia);border-radius:0 3px 3px 0;}
.sw.cl{background:repeating-linear-gradient(-45deg,#fff,#fff 4px,#EFE6EB 4px,#EFE6EB 5px);border:1px solid var(--line);}

/* ---------- Modal ---------- */
.overlay{
  position:fixed;inset:0;
  background:rgba(27,18,32,.6);
  backdrop-filter:blur(3px);
  display:none;
  align-items:center;justify-content:center;
  padding:20px;
  z-index:60;
}
.overlay.open{display:flex;}
.modal{
  background:var(--surface);
  border-radius:var(--r-lg);
  width:100%;
  max-width:720px;
  max-height:88vh;
  overflow:hidden;
  display:flex;
  position:relative;
  box-shadow:0 30px 80px -24px rgba(27,18,32,.5);
}
.m-poster{
  width:44%;
  flex-shrink:0;
  background:var(--tint);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.m-poster img{width:100%;height:100%;object-fit:cover;display:block;}
.m-poster .ph{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  color:var(--ink-3);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  padding:24px;text-align:center;
}
.m-poster .ph img{width:38px;height:38px;opacity:.35;}
.m-main{
  flex:1;
  padding:30px 30px 32px;
  overflow-y:auto;
}
.m-close{
  position:absolute;top:14px;right:14px;
  width:32px;height:32px;border-radius:50%;
  border:1px solid var(--line);
  background:var(--surface);
  cursor:pointer;color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  z-index:3;
}
.m-close:hover{background:var(--ink);border-color:var(--ink);color:#fff;}
.m-close:focus-visible{outline:2px solid var(--fucsia);outline-offset:2px;}
.m-date{
  font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--fucsia-deep);margin-bottom:10px;
}
.m-title{
  font-family:'Bricolage Grotesque',sans-serif;
  font-weight:800;font-size:27px;line-height:1.1;letter-spacing:-.015em;
  margin:0 0 16px;
}
.m-meta{
  display:flex;flex-direction:column;gap:8px;
  padding:14px 0;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  margin-bottom:16px;
}
.m-row{display:flex;gap:10px;align-items:center;font-size:13.5px;color:var(--ink);}
.m-row svg{width:15px;height:15px;flex-shrink:0;color:var(--ink-3);}
.m-desc{font-size:14.5px;line-height:1.65;color:var(--ink-2);margin:0;white-space:pre-line;}

@media(max-width:820px){
  .modal{flex-direction:column;max-width:440px;}
  .m-poster{width:100%;height:200px;}
  .m-main{padding:24px 22px 28px;}
  .m-title{font-size:23px;}
}

@media(max-width:700px){
  body{padding:0 14px 60px;}
  .weekdays,.grid{display:none;}
  .agenda{display:block;padding:4px 16px;}
  .board{border-radius:14px;}
  .masthead{padding:26px 0 16px;}
  .masthead img{height:46px;}
  .monthbar{padding:22px 0 16px;}
  .month-tools{width:100%;justify-content:space-between;padding-bottom:0;}
}

@media(prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important;}
}
</style>
</head>

const MESOS=['Gener','Febrer','Març','Abril','Maig','Juny','Juliol','Agost','Setembre','Octubre','Novembre','Desembre'];
const DOW=['Dg','Dl','Dt','Dc','Dj','Dv','Ds'];

const EVENTS = /*__EVENTS__*/[];

const byDate={};
EVENTS.forEach(e=>{(byDate[e.date]=byDate[e.date]||[]).push(e);});

const TODAY=new Date();
let cur = /*__START_MONTH__*/new Date();

function iso(y,m,d){return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
function isClosed(dow){return dow===1||dow===0;} // dilluns i diumenge

function starImg(cls,size){
  const i=document.createElement('img');
  i.src=STAR;i.alt='';i.className=cls;
  if(size){i.width=size;i.height=size;}
  return i;
}

function render(){
  const y=cur.getFullYear(),m=cur.getMonth();
  document.getElementById('mName').textContent=MESOS[m];
  document.getElementById('mYear').textContent=y;

  const grid=document.getElementById('grid');
  const agenda=document.getElementById('agenda');
  const empty=document.getElementById('empty');
  grid.innerHTML='';agenda.innerHTML='';

  const first=new Date(y,m,1);
  const lead=(first.getDay()+6)%7;          // dilluns = 0
  const ndays=new Date(y,m+1,0).getDate();
  const prevDays=new Date(y,m,0).getDate();

  let total=0;

  // dies del mes anterior (farciment)
  for(let i=lead-1;i>=0;i--){
    const c=document.createElement('div');
    c.className='cell pad';
    c.innerHTML=`<div class="daynum">${prevDays-i}</div>`;
    grid.appendChild(c);
  }

  for(let d=1;d<=ndays;d++){
    const key=iso(y,m,d);
    const evs=byDate[key]||[];
    total+=evs.length;
    const dow=new Date(y,m,d).getDay();
    const closed=isClosed(dow)&&evs.length===0;
    const isToday=(TODAY.getFullYear()===y&&TODAY.getMonth()===m&&TODAY.getDate()===d);

    const c=document.createElement('div');
    c.className='cell'+(closed?' closed':'')+(isToday?' today':'');

    const dn=document.createElement('div');
    dn.className='daynum';
    if(isToday){dn.appendChild(starImg('star',26));const s=document.createElement('span');s.textContent=d;dn.appendChild(s);}
    else{dn.textContent=d;}
    c.appendChild(dn);

    evs.forEach(ev=>{
      const b=document.createElement('button');
      b.className='ev';
      b.innerHTML=`<span class="ev-time">${ev.time}</span><span class="ev-title">${ev.title}</span>`;
      b.addEventListener('click',()=>open(ev));
      c.appendChild(b);
    });

    if(closed){
      const t=document.createElement('div');
      t.className='closed-tag';t.textContent='Tancat';
      c.appendChild(t);
    }
    grid.appendChild(c);
  }

  // farciment final per completar la darrera setmana
  const used=lead+ndays;
  const tail=(7-(used%7))%7;
  for(let i=1;i<=tail;i++){
    const c=document.createElement('div');
    c.className='cell pad';
    c.innerHTML=`<div class="daynum">${i}</div>`;
    grid.appendChild(c);
  }

  // vista agenda (mòbil)
  for(let d=1;d<=ndays;d++){
    const key=iso(y,m,d);
    (byDate[key]||[]).forEach(ev=>{
      const b=document.createElement('button');
      b.className='ag-item';
      const dt=new Date(y,m,d);
      b.innerHTML=`<div class="ag-date"><div class="ag-dow">${DOW[dt.getDay()]}</div><div class="ag-dnum">${d}</div></div>
                   <div class="ag-body"><div class="ag-time">${ev.time}</div><div class="ag-title">${ev.title}</div></div>`;
      b.addEventListener('click',()=>open(ev));
      agenda.appendChild(b);
    });
  }

  document.getElementById('mCount').innerHTML = total ? `<b>${total}</b> ${total===1?'activitat':'activitats'}` : '';

  const has=total>0;
  empty.style.display=has?'none':'block';
  grid.style.display=has?'':'none';
  agenda.style.display=has?'':'none';
  if(!has){document.querySelector('.weekdays').style.display='none';}
  else{document.querySelector('.weekdays').style.display='';}
}

/* ---------- Modal ---------- */
const ov=document.getElementById('overlay');
let lastFocus=null;

function open(ev){
  lastFocus=document.activeElement;
  const [y,m,d]=ev.date.split('-').map(Number);
  const dt=new Date(y,m-1,d);
  const dowFull=['Diumenge','Dilluns','Dimarts','Dimecres','Dijous','Divendres','Dissabte'][dt.getDay()];

  document.getElementById('mdDate').textContent=`${dowFull} ${d} de ${MESOS[m-1].toLowerCase()} de ${y}`;
  document.getElementById('mdTitle').textContent=ev.title;

  const meta=document.getElementById('mdMeta');
  meta.innerHTML=`<div class="m-row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>${ev.time}</div>`
    + (ev.place?`<div class="m-row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 6-9 12-9 12S3 16 3 10a9 9 0 1 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>${ev.place}</div>`:'');

  document.getElementById('mdDesc').textContent=ev.desc||'';

  const p=document.getElementById('mdPoster');
  if(ev.poster){p.innerHTML=`<img src="${ev.poster}" alt="Cartell de ${ev.title}">`;}
  else{p.innerHTML=`<div class="ph"><img src="${STAR}" alt=""><span>Sense cartell</span></div>`;}

  ov.classList.add('open');
  document.body.style.overflow='hidden';
  document.getElementById('mdClose').focus();
}

function close(){
  ov.classList.remove('open');
  document.body.style.overflow='';
  if(lastFocus)lastFocus.focus();
}

document.getElementById('mdClose').addEventListener('click',close);
ov.addEventListener('click',e=>{if(e.target===ov)close();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ov.classList.contains('open'))close();});

document.getElementById('btnPrev').addEventListener('click',()=>{cur=new Date(cur.getFullYear(),cur.getMonth()-1,1);render();});
document.getElementById('btnNext').addEventListener('click',()=>{cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);render();});
document.getElementById('btnToday').addEventListener('click',()=>{cur=new Date(TODAY.getFullYear(),TODAY.getMonth(),1);render();});

render();
</script>
